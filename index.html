<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="韓国旅">
<meta name="theme-color" content="#F1F4FA">
<title>韓国旅のしおり 2026</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍁</text></svg>">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F1F4FA; --card:#FFFFFF; --ink:#1B2233; --muted:#5E6678;
  --sky:#2446A6; --sky-soft:#DCE4F6;
  --ginkgo:#F2C230; --ginkgo-soft:#FCF1C9;
  --olive:#5E9E2F; --olive-soft:#E4F1D8; --line:#D5DBE8;
  --display:"Klee One","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
  --tabbar:64px;
  box-sizing:border-box;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#121826;--card:#1B2336;--ink:#EEF1F8;--muted:#A3ABBD;
    --sky:#8FA9EE;--sky-soft:#23305A;--ginkgo-soft:#3A3219;
    --olive:#9ACD6E;--olive-soft:#223219;--line:#2E3953;
  }
}
:root[data-theme="dark"]{--paper:#121826;--card:#1B2336;--ink:#EEF1F8;--muted:#A3ABBD;--sky:#8FA9EE;--sky-soft:#23305A;--ginkgo-soft:#3A3219;--olive:#9ACD6E;--olive-soft:#223219;--line:#2E3953}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--ginkgo);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== app shell ===== */
.app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding-top:env(safe-area-inset-top,0px)}
.screen{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 12px;display:none}
.screen>*{flex-shrink:0}
.screen.active{display:flex;flex-direction:column;animation:in .22s ease-out}
@keyframes in{from{opacity:0;transform:translateY(6px)}}

.tabbar{flex:none;display:grid;grid-template-columns:repeat(7,1fr);background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar button{height:var(--tabbar);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);position:relative}
.tabbar .n{font-size:21px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.tabbar .l{font-size:10.5px;white-space:nowrap;font-weight:700;line-height:1.2}
.tabbar svg{width:23px;height:23px;margin-bottom:1px}
.tabbar button[aria-selected="true"]{color:var(--sky)}
.tabbar button[aria-selected="true"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--sky)}
.tabbar button.oy[aria-selected="true"]{color:var(--olive)}
.tabbar button.oy[aria-selected="true"]::before{background:var(--olive)}
.tabbar button.pk[aria-selected="true"]{color:#E0527A}
.tabbar button.pk[aria-selected="true"]::before{background:#E0527A}
.tabbar .today{position:absolute;top:7px;right:calc(50% - 20px);width:7px;height:7px;border-radius:50%;background:var(--ginkgo)}

h1,h2{font-family:var(--display);font-weight:600;margin:0;line-height:1.25}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px}
.sec-label{font-size:13px;font-weight:700;color:var(--muted);margin:14px 2px 6px}

/* ===== overview ===== */
.ov-top{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.ov-top h1{font-size:30px}
.ov-top .who{margin:2px 0 0;color:var(--muted);font-size:13px}
.count{text-align:right;flex:none;line-height:1}
.count .num{font-family:var(--display);font-size:48px;color:var(--sky)}
.count .u{font-size:14px;font-weight:700}
.count .s{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:700}

.wx{display:flex;align-items:center;gap:12px;padding:10px 14px;margin-top:12px;background:var(--ginkgo-soft);border-color:var(--ginkgo)}
.wx .ic{font-size:30px;line-height:1;flex:none}
.wx b{display:block;font-size:15px}
.wx b em{font-style:normal;font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums}
.wx span{display:block;font-size:13px;color:var(--muted);line-height:1.5}
.flights{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.flight{padding:10px 12px}
.flight .top{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--muted)}
.flight .top b{color:var(--sky)}
.flight .rt{display:flex;align-items:center;justify-content:space-between;margin-top:4px;font-weight:700;font-size:19px;letter-spacing:.03em}
.flight .rt i{font-style:normal;color:var(--sky);font-size:13px}
.flight .tm{display:flex;justify-content:space-between;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}

.daylist{padding:4px 0}
.daylist button{display:flex;align-items:center;gap:12px;width:100%;padding:9px 14px;text-align:left}
.daylist button+button{border-top:1px solid var(--line)}
.daylist .d{flex:none;width:42px;text-align:center;line-height:1.1}
.daylist .d b{display:block;font-size:22px;color:var(--sky)}
.daylist .d span{font-size:11px;color:var(--muted);font-weight:700}
.daylist .t{flex:1;min-width:0}
.daylist .t b{display:block;font-size:16px}
.daylist .t span{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{flex:none;color:var(--muted)}

.stay{display:flex;gap:8px}
.stay .hotel{flex:1;min-width:0;padding:10px 14px;background:var(--ginkgo-soft);border-color:var(--ginkgo);text-align:left}
.stay .hotel small{display:block;font-size:12px;font-weight:700;color:var(--muted)}
.stay .hotel b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stay .call{flex:none;width:74px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--sky);padding:8px 4px;text-align:center;line-height:1.3}
.stay .call span{font-size:20px;line-height:1.2}
.stay .call.off{color:var(--muted)}

/* ===== day ===== */
.dhead small{display:block;font-size:13px;font-weight:700;color:var(--sky)}
.dhead h2{font-size:28px}
.dhead p{margin:4px 0 0;color:var(--muted);font-size:14px}
.tl{list-style:none;margin:14px 0 0;padding:6px 0}
.tl button{display:grid;grid-template-columns:44px 18px 1fr auto;align-items:center;width:100%;min-height:52px;text-align:left;padding:0 12px 0 8px;position:relative}
.tl .tm{font-size:13px;font-weight:700;color:var(--sky);text-align:right;padding-right:8px;font-variant-numeric:tabular-nums}
.tl .dot{justify-self:center;width:13px;height:13px;border-radius:50%;border:3px solid var(--sky);background:var(--card);position:relative;z-index:1}
.tl li{position:relative}
.tl li::before{content:"";position:absolute;left:60px;top:0;bottom:0;width:2px;background:var(--sky-soft)}
.tl li:first-child::before{top:50%}
.tl li:last-child::before{bottom:50%}
.tl .hotel .dot{border-color:var(--ginkgo);background:var(--ginkgo)}
.tl .tx{padding:6px 0 6px 10px;min-width:0}
.tl .tx b{display:block;font-size:15.5px;line-height:1.35}
.tl .tx span{display:block;font-size:12px;color:var(--muted)}
.tl li+li .tx{border-top:1px solid var(--line)}
.tl button{grid-template-columns:44px 18px 1fr 52px}
.tl .th{justify-self:end;width:40px;height:40px;border-radius:10px;object-fit:cover;background:var(--sky-soft)}
.tl .chev{justify-self:end}
.tl .opt{display:inline-block;font-size:11px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 6px;margin-left:6px;vertical-align:2px}
.tl .fav{color:#E0527A;margin-left:4px;font-size:14px}
.tl .cnt{display:inline-block;font-size:11px;font-weight:700;color:#fff;background:var(--sky);border-radius:6px;padding:0 6px;margin-left:6px;vertical-align:2px}
.hint{margin:10px 2px 0;font-size:13px;font-weight:700;color:var(--muted)}
.hint b{color:#E0527A}
.empty-day{margin:14px 0 0;padding:28px 18px;text-align:center;color:var(--muted);font-size:15px}
.empty-day b{display:block;font-size:40px;line-height:1.2;margin-bottom:6px}

/* ===== detail page ===== */
.back{display:inline-flex;align-items:center;gap:4px;font-weight:700;color:var(--sky);font-size:15px;padding:4px 0;margin-bottom:6px}
.gal-x{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -16px;padding:0 16px;flex:none}
.gal::-webkit-scrollbar{display:none}
.gal figure{flex:none;width:86%;margin:0;scroll-snap-align:center;position:relative;border-radius:16px;overflow:hidden;aspect-ratio:4/3;background:var(--sky-soft)}
.gal img{width:100%;height:100%;object-fit:cover;display:block}
.gal figcaption{position:absolute;left:0;right:0;bottom:0;padding:14px 10px 5px;font-size:9.5px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.55))}
.pg-title{margin:14px 0 0}
.pg-title h2{font-size:28px}
.pg-title small{font-size:13px;color:var(--muted);font-weight:700}
.pg-intro{white-space:pre-line;margin:6px 0 0;font-size:15px}
.pg-sec{margin-top:22px}
.pg-sec h3{font-family:var(--display);font-weight:600;font-size:22px;margin:0 0 8px}
.pg-sec h3 span{font-family:var(--body);font-size:13px;color:var(--muted);font-weight:700;margin-left:6px}
.items{display:grid;gap:10px}
.item{overflow:hidden}
.item .im{aspect-ratio:16/9;background:var(--sky-soft)}
.item .im img{width:100%;height:100%;object-fit:cover;display:block}
.item .cr{margin:0;padding:3px 12px 0;font-size:9.5px;color:var(--muted)}
.item .bd{padding:10px 14px 12px}
.item b{display:block;font-size:17px;line-height:1.4}
.item .ko{display:block;font-size:13px;color:var(--muted)}
.item p{margin:6px 0 0;font-size:15px;line-height:1.6}
.item p.soon{color:var(--muted);font-size:14px}
.item .ob{display:flex;gap:6px;margin-top:10px}
.item .ob a,.item .ob button{font-size:14px;font-weight:700;padding:7px 14px;border-radius:999px}
.item .ob a{background:var(--sky-soft);color:var(--sky)}
.item .ob button{border:2px solid #F3BFD0;color:#E0527A;padding:5px 13px}
.item .ob button[aria-pressed="true"]{background:#E0527A;border-color:#E0527A;color:#fff}
.soon-card{padding:16px;color:var(--muted);font-size:14px;text-align:center}
.pg-end{height:12px;flex:none}

/* carousel */
.car{position:relative;border-radius:16px;overflow:hidden;background:var(--sky-soft)}
.car .trk{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;scroll-behavior:smooth}
.car .trk::-webkit-scrollbar{display:none}
.car figure{flex:0 0 100%;margin:0;scroll-snap-align:start;position:relative;aspect-ratio:4/3}
.car.wide figure{aspect-ratio:16/10}
.car img{width:100%;height:100%;object-fit:cover;display:block}
.car figcaption{position:absolute;left:0;right:0;bottom:0;padding:18px 10px 20px;font-size:9px;color:rgba(255,255,255,.85);background:linear-gradient(transparent,rgba(0,0,0,.5))}
.car .nav{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.9);color:#1B2233;display:flex;align-items:center;justify-content:center;font-size:22px;line-height:1;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.car .prev{left:8px}.car .next{right:8px}
.car .nav[disabled]{opacity:0;pointer-events:none}
.car .dots{position:absolute;left:0;right:0;bottom:7px;display:flex;justify-content:center;gap:5px;pointer-events:none}
.car .dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.5)}
.car .dots i.on{background:#fff;width:16px;border-radius:3px}
.item .car{border-radius:0}
.item .ph0{aspect-ratio:16/7;display:flex;align-items:center;justify-content:center;font-size:40px;background:var(--sky-soft)}
/* list / map toggle */
.pg-seg{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin-top:4px;position:sticky;top:0;z-index:5;box-shadow:0 4px 10px -6px rgba(0,0,0,.2)}
.pg-seg button{padding:8px 0;border-radius:9px;font-weight:700;font-size:14px;color:var(--muted)}
.pg-seg button[aria-pressed="true"]{background:var(--sky);color:#fff}
.gmap{position:relative;margin-top:12px;border-radius:18px;overflow:hidden;background:#F4EFE3;border:1px solid var(--line)}
.gmap svg{display:block;width:100%;height:auto;touch-action:manipulation}
.gmap .pinb{cursor:pointer}
.gmap .pinb circle.hit{fill:transparent}
.gmap .ttl{position:absolute;left:12px;top:10px;font-family:var(--display);font-size:18px;color:#5B4A2E;pointer-events:none}
.gmap .note{position:absolute;right:10px;bottom:8px;font-size:10px;color:#8A7A5C;pointer-events:none}
.mcard{margin-top:10px;overflow:hidden}
.mcard .car{border-radius:0}
.mcard .car figure{aspect-ratio:2/1}
.mcard .bd{padding:10px 14px 12px}
.mcard .top{display:flex;align-items:center;gap:8px}
.mcard .top .pin{width:26px;height:26px;font-size:12px;border-width:2px;box-shadow:none;flex:none}
.mcard .top b{flex:1;font-size:17px;line-height:1.35}
.mcard .ko{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.mcard p{margin:6px 0 0;font-size:15px;line-height:1.6}
.mcard .ob{display:flex;gap:6px;margin-top:10px;align-items:center}
.mcard .ob a,.mcard .ob button[data-n]{font-size:14px;font-weight:700;padding:7px 14px;border-radius:999px}
.mcard .ob a{background:var(--sky-soft);color:var(--sky)}
.mcard .ob button[data-n]{border:2px solid #F3BFD0;color:#E0527A;padding:5px 13px}
.mcard .ob button[data-n][aria-pressed="true"]{background:#E0527A;border-color:#E0527A;color:#fff}
.mcard .step{margin-left:auto;display:flex;gap:6px}
.mcard .step button{width:36px;height:36px;border-radius:50%;background:var(--paper);border:1px solid var(--line);font-size:20px;line-height:1}
.mhint{margin:8px 2px 0;font-size:13px;color:var(--muted);font-weight:700}
.pmap{height:360px;border-radius:16px;overflow:hidden;margin-top:12px;background:var(--sky-soft);position:relative}
.pmap .msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;color:var(--muted);font-size:14px}
.pin{width:30px;height:30px;border-radius:50%;color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);font-family:var(--body)}
.legend{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.legend li{display:flex;align-items:center;gap:10px;padding:8px 12px}
.legend .pin{flex:none;width:26px;height:26px;font-size:12px;border-width:2px;box-shadow:none}
.legend b{flex:1;font-size:15px;line-height:1.35}
.legend b span{display:block;font-size:12px;color:var(--muted);font-weight:500}
.legend a{font-size:13px;font-weight:700;color:var(--sky);background:var(--sky-soft);padding:5px 11px;border-radius:999px}
.legend .nopin{flex:none;width:26px;height:26px;border-radius:50%;border:2px dashed var(--line)}
.leaflet-popup-content{font-family:var(--body);font-size:14px;margin:10px 12px}
.leaflet-popup-content a{color:var(--sky);font-weight:700}

/* update banner */
.upd{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);max-width:536px;margin:0 auto;z-index:70;background:var(--sky);color:#fff;border-radius:14px;padding:12px 14px;display:none;align-items:center;gap:10px;box-shadow:0 6px 20px rgba(0,0,0,.25);font-weight:700;font-size:15px}
.upd.show{display:flex}
.upd span{flex:1}
.upd button{background:#fff;color:var(--sky);border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px}

/* ===== olive young ===== */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;flex:none}
.seg button{padding:8px 0;border-radius:9px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--olive);color:#fff}
.oy-pane{display:none;flex:1;min-height:0;flex-direction:column;margin-top:10px}
.oy-pane.on{display:flex}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:none;padding-bottom:8px}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:2px solid var(--olive);color:var(--olive);background:var(--card);border-radius:999px;padding:4px 13px;font-weight:700;font-size:14px}
.chips button[aria-pressed="true"]{background:var(--olive);color:#fff}
.map{flex:1;min-height:220px;border-radius:16px;overflow:hidden;background:var(--olive-soft);position:relative}
.map iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.map a{position:absolute;right:8px;bottom:8px;background:var(--olive);color:#fff;font-weight:700;font-size:13px;padding:7px 12px;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.stores{flex:none;display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding:10px 0 2px;scrollbar-width:none}
.stores::-webkit-scrollbar{display:none}
.store{flex:none;width:82%;scroll-snap-align:start;padding:10px 12px;display:flex;flex-direction:column}
.store b{font-size:15px;line-height:1.35}
.store .ad{font-size:12px;color:var(--muted);line-height:1.45;margin-top:2px;flex:1}
.store .row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:11px;font-weight:700;background:var(--ginkgo-soft);border-radius:6px;padding:1px 7px}
.store a{margin-left:auto;font-size:13px;font-weight:700;color:var(--olive);background:var(--olive-soft);padding:5px 11px;border-radius:999px}
.store.none{width:100%;color:var(--muted);font-size:14px;align-items:center;justify-content:center;min-height:70px}

.addrow{display:flex;gap:8px;flex:none}
.addrow input{flex:1;min-width:0;font:inherit;font-size:16px;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.addrow button{flex:none;border-radius:12px;background:var(--olive);color:#fff;font-weight:700;padding:0 18px}
.shop{list-style:none;margin:10px 0 0;padding:0;flex:1;min-height:0;overflow-y:auto}
.shop li{display:flex;align-items:center;gap:10px;padding:11px 12px}
.shop li+li{border-top:1px solid var(--line)}
.shop label{flex:1;display:flex;align-items:center;gap:12px;cursor:pointer;min-width:0}
.shop input{width:24px;height:24px;accent-color:var(--olive);flex:none}
.shop .done span{text-decoration:line-through;color:var(--muted)}
.shop .del{color:var(--muted);font-size:20px;padding:2px 6px}
.shop .none{color:var(--muted);font-size:14px;justify-content:center;padding:24px 12px;text-align:center}
.progress{flex:none;font-size:13px;color:var(--muted);margin:8px 2px 0;font-weight:700}

/* ===== picks ===== */
.pk-head small{display:block;font-size:13px;font-weight:700;color:#E0527A}
.pk-head h2{font-size:28px}
.pk-head p{margin:4px 0 0;color:var(--muted);font-size:14px}
.pk-chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:none;margin:12px 0 10px}
.pk-chips::-webkit-scrollbar{display:none}
.pk-chips button{flex:none;border:2px solid #E0527A;color:#E0527A;background:var(--card);border-radius:999px;padding:4px 13px;font-weight:700;font-size:14px}
.pk-chips button[aria-pressed="true"]{background:#E0527A;color:#fff}
.pk-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-content:start}
.pk{display:flex;flex-direction:column;text-align:left;overflow:hidden;position:relative}
.pk .im{aspect-ratio:16/10;display:flex;align-items:center;justify-content:center;font-size:44px;background:#FBE4EC}
.pk .im img{width:100%;height:100%;object-fit:cover}
.pk .tx{padding:8px 10px 10px}
.pk .tx small{display:block;font-size:11px;font-weight:700;color:var(--muted)}
.pk .tx b{display:block;font-size:15px;line-height:1.35}
.pk .fav{position:absolute;top:6px;right:8px;color:#E0527A;font-size:18px;text-shadow:0 0 4px #fff}
.pk-tip{grid-column:1/-1;margin-top:6px;padding:12px 14px;background:var(--ginkgo-soft);border-color:var(--ginkgo);font-size:13.5px;line-height:1.6}
.pk-tip b{display:block;font-size:14px;margin-bottom:2px}
.pk-sample{margin:10px 2px 0;font-size:12px;color:var(--muted)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pk .im{background:#3A2330}}

/* ===== sheet ===== */
.scrim{position:fixed;inset:0;background:rgba(10,14,25,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--card);border-radius:22px 22px 0 0;z-index:41;transform:translateY(105%);transition:transform .25s ease-out;padding:10px 18px calc(env(safe-area-inset-bottom,0px) + 18px);max-height:88%;overflow-y:auto}
.sheet.open{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet .ph{aspect-ratio:16/10;border-radius:14px;overflow:hidden;background:repeating-linear-gradient(135deg,var(--sky-soft) 0 14px,transparent 14px 28px),var(--paper);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px}
.sheet .ph img{width:100%;height:100%;object-fit:cover}
.sheet .cr{margin:4px 2px 0;font-size:10px;color:var(--muted)}
.sheet .opt{display:inline-block;font-size:12px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 7px;margin-top:10px}
.btn.add{background:var(--olive-soft);color:var(--olive)}
.btn.like{flex:none;width:auto;padding:13px 16px;background:var(--card);color:#E0527A;border:2px solid #F3BFD0}
.btn.like[aria-pressed="true"]{background:#E0527A;color:#fff;border-color:#E0527A}
.sheet .tm{margin-top:10px;font-size:14px;font-weight:700;color:var(--sky)}
.sheet h3{margin:2px 0 0;font-size:22px;line-height:1.35}
.sheet .ko{margin:0;color:var(--muted);font-size:14px}
.sheet .note{white-space:pre-line;margin:10px 0 0;font-size:16px}
.sheet .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.opts{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px}
.opts li{border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.opts .h{display:flex;align-items:flex-start;gap:8px}
.opts .h b{flex:1;font-size:16px;line-height:1.4}
.opts .h b span{display:block;font-size:12px;font-weight:500;color:var(--muted)}
.opts p{margin:4px 0 0;font-size:14px;line-height:1.55}
.opts .ob{display:flex;gap:6px;margin-top:8px}
.opts .ob a,.opts .ob button{font-size:13px;font-weight:700;padding:6px 12px;border-radius:999px}
.opts .ob a{background:var(--sky-soft);color:var(--sky)}
.opts .ob button{border:2px solid #F3BFD0;color:#E0527A;padding:4px 11px}
.opts .ob button[aria-pressed="true"]{background:#E0527A;border-color:#E0527A;color:#fff}
.sheet .where{margin:10px 0 0;font-size:14px;font-weight:700;color:var(--sky)}
.btn{flex:1;display:flex;align-items:center;justify-content:center;padding:13px 10px;border-radius:12px;font-weight:700;font-size:15px;background:var(--sky);color:#fff;text-align:center}
.btn.sub{background:var(--sky-soft);color:var(--sky)}

/* taxi fullscreen */
.big{position:fixed;inset:0;z-index:60;background:#fff;color:#111;display:none;flex-direction:column;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 24px) 24px calc(env(safe-area-inset-bottom,0px) + 24px)}
.big.open{display:flex}
.big p{margin:0}.big .t{font-size:18px;color:#555}
.big .a{font-size:34px;font-weight:700;line-height:1.45;margin:14px 0 30px;word-break:keep-all}
.big button{align-self:center;border-radius:999px;background:#111;color:#fff;padding:12px 30px;font-weight:700}
</style>

  // selected pin drawn last (on top)
  const order=pinSvg.map((g,i)=>i).sort((a,b)=>(a===mapSel)-(b===mapSel)).map(i=>pinSvg[i]).join("");
  const svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc("地図")}">
      <rect width="${W}" height="${H}" fill="#F4EFE3"/>${isSuwon?hill:""}${parks}
      ${isSuwon?`<path d="${path(STREAM)}" fill="none" stroke="#9CC7E4" stroke-width="${14*1}" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="${path(WALL)} Z" fill="rgba(255,255,255,.45)" stroke="#B59A6A" stroke-width="${9*1}" stroke-dasharray="${18*1} ${7*1}" stroke-linejoin="round"/>`:""}
      ${labels}${order}</svg>`;
  const x=pins[mapSel];
  const card = x ? `<article class="card mcard">
      ${x.it.photos&&x.it.photos.length?carousel(x.it.photos):""}
      <div class="bd"><div class="top"><span class="pin" style="background:${SEC_COLORS[x.si%5]}">${x.no}</span><b>${esc(x.it.name)}</b></div>
        <span class="ko">${esc(x.sec.title)}・${esc(x.it.ko)}</span>
        ${x.it.note?`<p>${esc(x.it.note)}</p>`:`<p style="color:var(--muted)">写真やくわしい情報は、${x.it.naver?"NAVER地図":"Googleマップ"}で見られます</p>`}
        <div class="ob"><button type="button" data-n="${esc(x.it.name)}" aria-pressed="${!!favs["item|"+x.it.name]}">${favs["item|"+x.it.name]?"♥":"♡"} 気になる</button>
          ${(x.it.map||x.it.naver)?`<a href="${placeUrl(x.it)}" target="_blank" rel="noopener">${x.it.naver?"NAVER地図":"地図アプリ"}</a>`:""}
          ${pins.length>1?`<span class="step"><button type="button" class="mprev" aria-label="前の場所">‹</button><button type="button" class="mnext" aria-label="次の場所">›</button></span>`:""}</div>
      </div></article>` : "";
  const legend = none.length ? `<p class="mhint">地図の場所を準備中</p><ul class="legend">${none.map(y=>`<li class="card"><span class="nopin"></span><b>${esc(y.it.name)}<span>${esc(y.sec.title)}</span></b>${(y.it.map||y.it.naver)?`<a href="${placeUrl(y.it)}" target="_blank" rel="noopener">開く</a>`:""}</li>`).join("")}</ul>` : "";
  $("#pgBody").innerHTML = `<div class="gmap">${svg}<span class="ttl">${esc(P.mapTitle||"")}</span><span class="note">イラストマップ（位置はだいたい）</span></div>
    <p class="mhint">ピンをタップすると、下にくわしい紹介が出ます。</p>${card}${legend}`;
  wireCarousels($("#pgBody"));
  const go=i=>{ mapSel=(i+pins.length)%pins.length; const st=$("#s-day").scrollTop; showPageMap(P); $("#s-day").scrollTop=st; };
  $("#pgBody").querySelectorAll(".pinb").forEach(g=>g.addEventListener("click",()=>go(+g.dataset.i)));
  const pv=$("#pgBody .mprev"), nx=$("#pgBody .mnext"); if(pv){ pv.onclick=()=>go(mapSel-1); nx.onclick=()=>go(mapSel+1); }
}


/* ---------- sheet ---------- */
function openSheet(s, key, onFav, isPick){
  const hotel = s.hotel, title = hotel ? "宿へ" : (s.title||s.name), mq = hotel ? DATA.hotel.map : s.map, murl = hotel ? gmap(DATA.hotel.map) : ((s.map||s.naver) ? placeUrl(s) : "");
  $("#sheet").innerHTML = `<div class="grab"></div>
    ${s.photo ? `<div class="ph"><img src="${esc(s.photo)}" alt=""></div>${s.credit?`<p class="cr">${esc(s.credit)}</p>`:""}` : ""}
    ${s.optional?`<span class="opt">お好みで</span>`:""}
    ${s.time?`<p class="tm">${esc(s.time)}</p>`:""}
    <h3 id="shTitle">${esc(title)}</h3>
    <p class="ko">${esc(hotel?DATA.hotel.kr:s.ko)}</p>
    <p class="note">${esc(hotel?DATA.hotel.jp:(s.note||"くわしい内容は準備中です"))}</p>
    ${s.where?`<p class="where">🛍 ${esc(s.where)}</p>`:""}
    ${s.options?`<ul class="opts">${s.options.map((o,k)=>`<li><div class="h"><b>${esc(o.name)}<span>${esc(o.ko)}</span></b></div>${o.note?`<p>${esc(o.note)}</p>`:""}<div class="ob"><button type="button" data-k="${k}" aria-pressed="${!!favs["opt|"+o.name]}">${favs["opt|"+o.name]?"♥":"♡"} 気になる</button>${o.map?`<a href="${gmap(o.map)}" target="_blank" rel="noopener">地図</a>`:""}</div></li>`).join("")}</ul>`:""}
    <div class="acts">
      ${(hotel||s.options)?"":`<button type="button" class="btn like" id="like" aria-pressed="${!!favs[key]}">${favs[key]?"♥ 気になる":"♡ 気になる"}</button>`}
      ${isPick?`<button type="button" class="btn add" id="toList">リストに追加</button>`:""}
      ${murl?`<a class="btn" href="${murl}" target="_blank" rel="noopener">${(!hotel&&s.naver)?"NAVER地図":"地図で見る"}</a>`:""}
      <button type="button" class="btn sub" id="shClose">閉じる</button>
    </div>`;
  $("#scrim").classList.add("open"); $("#sheet").classList.add("open");
  $("#shClose").addEventListener("click", closeSheet);
  const lk=$("#like"); if(lk) lk.addEventListener("click", ()=>{
    favs[key]=!favs[key]; if(!favs[key]) delete favs[key]; saveF();
    lk.setAttribute("aria-pressed", !!favs[key]); lk.textContent = favs[key]?"♥ 気になる":"♡ 気になる";
    onFav && onFav();
  });
  document.querySelectorAll(".opts button[data-k]").forEach(bt=>bt.addEventListener("click", ()=>{
    const o=s.options[+bt.dataset.k], k2="opt|"+o.name; favs[k2]=!favs[k2]; if(!favs[k2]) delete favs[k2]; saveF();
    bt.setAttribute("aria-pressed", !!favs[k2]); bt.textContent=(favs[k2]?"♥":"♡")+" 気になる"; onFav && onFav();
  }));
  const tl=$("#toList"); if(tl) tl.addEventListener("click", ()=>{
    const t=s.name; if(!shop.some(x=>x.t===t)){ shop.push({t,done:false}); save(); renderShop(); }
    tl.textContent="追加しました ✓"; tl.disabled=true;
  });
}
function closeSheet(){ $("#scrim").classList.remove("open"); $("#sheet").classList.remove("open"); }
$("#scrim").addEventListener("click", closeSheet);
let ty=null;
$("#sheet").addEventListener("touchstart",e=>{ if($("#sheet").scrollTop<=0) ty=e.touches[0].clientY; },{passive:true});
$("#sheet").addEventListener("touchend",e=>{ if(ty!==null && e.changedTouches[0].clientY-ty>70) closeSheet(); ty=null; });

/* ---------- オリヤン ---------- */
let oyArea = 0, mapLoaded = false;
$("#chips").innerHTML = DATA.oliveyoung.map((a,i)=>`<button type="button" data-i="${i}">${esc(a.area)}</button>`).join("");
function renderOY(i){
  oyArea = i; const a = DATA.oliveyoung[i];
  document.querySelectorAll("#chips button").forEach((b,j)=>b.setAttribute("aria-pressed", j===i));
  $("#oyMap").src = "https://maps.google.com/maps?q="+encodeURIComponent(a.q)+"&hl=ja&z=15&output=embed";
  $("#oyAll").href = gmap(a.q);
  $("#stores").innerHTML = a.stores.length ? a.stores.map(s=>`
    <div class="card store"><b>${esc(s.name)}</b>
      <span class="ad">${esc(s.ko)}${s.addr?"<br>"+esc(s.addr):""}</span>
      <div class="row">${s.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join("")}<a href="${gmap(s.ko)}" target="_blank" rel="noopener">地図</a></div>
    </div>`).join("")
    : `<div class="card store none">このエリアのお店は地図で見られます</div>`;
  $("#stores").scrollLeft = 0;
}
function ensureMap(){ if(!mapLoaded){ mapLoaded = true; renderOY(oyArea); } }
$("#chips").addEventListener("click", e=>{ const b=e.target.closest("button"); if(b) renderOY(+b.dataset.i); });
$("#oySeg").addEventListener("click", e=>{
  const b=e.target.closest("button"); if(!b) return;
  document.querySelectorAll("#oySeg button").forEach(x=>x.setAttribute("aria-pressed", x===b));
  $("#p-map").classList.toggle("on", b.dataset.p==="map");
  $("#p-list").classList.toggle("on", b.dataset.p==="list");
});

/* 買い物リスト（このスマホに保存） */
const KEY="korea-trip-shopping-v1";
let shop; try{ shop=JSON.parse(localStorage.getItem(KEY)); }catch(e){}
if(!Array.isArray(shop)) shop=[];
const save=()=>{ try{ localStorage.setItem(KEY, JSON.stringify(shop)); }catch(e){} };
function renderShop(){
  $("#shop").innerHTML = shop.length ? shop.map((it,i)=>`
    <li class="${it.done?"done":""}"><label><input type="checkbox" data-i="${i}" ${it.done?"checked":""}><span>${esc(it.t)}</span></label>
    <button class="del" type="button" data-del="${i}" aria-label="削除">×</button></li>`).join("")
    : `<li class="none">欲しいものを入力して「追加」を押してください。<br>このスマホに保存されます。</li>`;
  const d=shop.filter(x=>x.done).length;
  $("#prog").textContent = shop.length ? `${shop.length}個中 ${d}個 買いました` : "";
}
function addShop(){ const v=$("#shopIn").value.trim(); if(!v) return; shop.push({t:v,done:false}); $("#shopIn").value=""; save(); renderShop(); }
$("#shopAdd").addEventListener("click", addShop);
$("#shopIn").addEventListener("keydown", e=>{ if(e.key==="Enter" && !e.isComposing){ e.preventDefault(); addShop(); }});
$("#shop").addEventListener("change", e=>{ const i=e.target.dataset.i; if(i!=null){ shop[i].done=e.target.checked; save(); renderShop(); }});
$("#shop").addEventListener("click", e=>{ const i=e.target.dataset.del; if(i!=null){ shop.splice(i,1); save(); renderShop(); }});
renderShop();

/* ---------- おすすめ ---------- */
let pkCat = "すべて";
function renderPicks(){
  const cats = ["すべて", ...new Set(DATA.picks.map(p=>p.cat))];
  $("#pkChips").innerHTML = cats.map(c=>`<button type="button" data-c="${esc(c)}" aria-pressed="${c===pkCat}">${esc(c)}</button>`).join("");
  const list = DATA.picks.map((p,i)=>({p,i})).filter(x=>pkCat==="すべて"||x.p.cat===pkCat);
  $("#pkGrid").innerHTML = list.map(({p,i})=>`
    <button type="button" class="card pk" data-i="${i}">
      <span class="im">${p.photo?`<img src="${esc(p.photo)}" alt="" loading="lazy">`:esc(p.emoji||"🎁")}</span>
      <span class="tx"><small>${esc(p.cat)}</small><b>${esc(p.name)}</b></span>
      ${favs["pick|"+p.name]?'<i class="fav">♥</i>':""}
    </button>`).join("") + ((pkCat==="すべて"||pkCat.startsWith("お酒"))?`<div class="card pk-tip"><b>🍶 お酒を日本に持って帰るとき</b>日本への持ち込みは、ひとり3本（1本760mlくらい）まで免税です。お酒は液体なので、スーツケースに入れて預けてください。生のマッコリは発酵してガスが出ることがあるので、しっかり包むか、韓国で飲んでしまうのがおすすめです。</div>`:"")
    + (DATA.picks.some(p=>p.sample)?`<p class="pk-sample" style="grid-column:1/-1">※ いまは見本です。もうすぐ中身が届きます。</p>`:"");
}
$("#pkChips").addEventListener("click", e=>{ const b=e.target.closest("button"); if(b){ pkCat=b.dataset.c; renderPicks(); }});
$("#pkGrid").addEventListener("click", e=>{ const b=e.target.closest("button[data-i]"); if(!b) return; const p=DATA.picks[+b.dataset.i]; openSheet(p, "pick|"+p.name, renderPicks, true); });

/* ---------- 自動アップデート確認 ---------- */
const BUILD_ID = "20261002010732";
async function checkUpdate(){
  if (BUILD_ID === "dev") return;
  try {
    const r = await fetch("version.json?t=" + Date.now(), { cache:"no-store" });
    if (!r.ok) return;
    const v = await r.json();
    if (v.build && v.build !== BUILD_ID) $("#upd").classList.add("show");
  } catch(e) {}
}
$("#updBtn").addEventListener("click", ()=>{ try{ sessionStorage.setItem("reopen", location.hash); }catch(e){} location.reload(); });
document.addEventListener("visibilitychange", ()=>{ if (document.visibilityState === "visible") checkUpdate(); });
setInterval(checkUpdate, 5*60*1000);
setTimeout(checkUpdate, 3000);

/* ---------- start ---------- */
const hash = location.hash.slice(1), ti = todayIdx();
go(hash || (ti>=0 ? "d"+ti : "all"), false);
</script>
